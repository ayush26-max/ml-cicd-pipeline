name: ML CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ml-pipeline-app

jobs:
  # ── Job 1: Run all tests ────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit and integration tests
        run: pytest tests/ -v --tb=short

  # ── Job 2: Preprocess + Train ───────────────────────────────────────────────
  train:
    name: Preprocess & Train
    runs-on: ubuntu-latest
    needs: [test]   # only runs if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preprocess data
        run: python src/preprocess.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

      - name: Train model
        run: python src/train.py
        env:
          MLFLOW_TRACKING_URI:      ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

      - name: Upload processed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/
          retention-days: 1

  # ── Job 3: Evaluate — pipeline gate ────────────────────────────────────────
  evaluate:
    name: Evaluate Model (Gate)
    runs-on: ubuntu-latest
    needs: [train]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download processed artifacts
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/

      - name: Run evaluation gate
        run: python src/evaluate.py   # exits with code 1 if accuracy < threshold
        env:
          MLFLOW_TRACKING_URI:      ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

  # ── Job 4: Build Docker image ───────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [evaluate]   # only builds if model passed evaluation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download processed artifacts
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: Deploy ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'   # only deploy on main branch pushes

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json"
        # Alternative: replace with SSH deploy command if self-hosting:
        # ssh -i ${{ secrets.SSH_PRIVATE_KEY }} user@your-server \
        #   "docker pull ghcr.io/${{ github.repository }}/ml-pipeline-app:latest && \
        #    docker stop ml-app || true && \
        #    docker run -d --name ml-app -p 8000:8000 \
        #      -e MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }} \
        #      ghcr.io/${{ github.repository }}/ml-pipeline-app:latest"

      - name: Deployment summary
        run: |
          echo "✅ Deployment triggered successfully"
          echo "Image: ghcr.io/${{ github.repository }}/ml-pipeline-app:latest"
          echo "Commit: ${{ github.sha }}"
